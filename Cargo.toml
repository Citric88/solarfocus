
[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "crates/core-domain",
    "crates/intelligence",
]

# 🧩 Dependencias compartidas del workspace (no externas en core-domain)
[workspace.dependencies]
iced = { version = "0.13", features = ["tokio", "canvas"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["std", "clock"] }
serde_json = "1"

# 🗄️ Dependencias de infraestructura (solo apps/desktop)
rusqlite = { version = "0.31", features = ["bundled"] }
env_logger = "0.11"
directories = "5"
rand = "0.8"
log = "0.4"

# 🧠 v1.2 — capa de inteligencia
active-win-pos-rs = "0.8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }

# 🧠 Phase 3 — LLM tier (feature-gated in apps/desktop behind `llm`)
llama-cpp-2 = { version = "0.1.146", default-features = false, features = ["sampler"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
futures-util = "0.3"

# 🧠 Phase 4 — Classifier tier (feature-gated in apps/desktop behind `classifier`)
ort = "2.0.0-rc.12"
ndarray = { version = "0.17", default-features = false, features = ["std"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
