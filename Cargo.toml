
[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "crates/core-domain",
]

# 🧩 Dependencias compartidas del workspace (no externas en core-domain)
[workspace.dependencies]
iced = { version = "0.13", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["std", "clock"] }

# 🗄️ Dependencias de infraestructura (solo apps/desktop)
rusqlite = { version = "0.31", features = ["bundled"] }
env_logger = "0.11"
directories = "5"
rand = "0.8"
log = "0.4"
