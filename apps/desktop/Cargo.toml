[package]
name = "solarfocus-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
env_logger = { workspace = true }
directories = { workspace = true }
rand = { workspace = true }
log = { workspace = true }
active-win-pos-rs = { workspace = true }
tokio = { workspace = true }
solar-focus-core = { path = "../../crates/core-domain" }
solar-focus-intelligence = { path = "../../crates/intelligence" }
thiserror = "1"

# Phase 3 — LLM tier (feature-gated)
llama-cpp-2 = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }

# Phase 4 — ONNX classifier tier (feature-gated)
ort = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
# ENH-7 — share the download stack with the classifier feature too.

# v1.3 Wave B — webcam capture for presence detection (feature-gated).
# nokhwa = pure-Rust AVFoundation binding on macOS. Avoids opencv-rust.
nokhwa = { version = "0.10", optional = true, default-features = false, features = ["input-avfoundation"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

# v1.3 Wave C — calendar awareness. v1.3.0 ships the pure free-block
# algorithm + manual deadline input. v1.3.1 will add live EventKit
# bindings (objc2-event-kit) for iCloud / Google / Exchange / Local.

[features]
default = []
# Enabling `llm` pulls in llama-cpp-2 (C++ build, ~2-3 min cold) + the
# model download stack. Without it, App falls back to MockCoach.
llm = ["dep:llama-cpp-2", "dep:reqwest", "dep:sha2", "dep:futures-util", "dep:fs2"]
gpu-metal = ["llm", "llama-cpp-2/metal"]
gpu-cuda = ["llm", "llama-cpp-2/cuda"]
# Phase 4 — DistilBERT-INT8 ONNX classifier. Falls back to RulesClassifier
# at runtime if the ONNX file is missing on disk.
# ENH-7 also pulls in the shared download stack so the classifier can
# fetch its own model + tokenizer files.
classifier = [
    "dep:ort",
    "dep:ndarray",
    "dep:tokenizers",
    "dep:reqwest",
    "dep:sha2",
    "dep:futures-util",
    "dep:fs2",
]

# v1.3 Wave B — camera-based presence detection. nokhwa for capture.
# v1.3.0 ships brightness-change heuristic (no model dependency); v1.3.1
# will add YuNet ONNX face detection.
presence = [
    "dep:nokhwa",
    "dep:image",
]

# v1.3 Wave C — calendar-aware focus suggestions. v1.3.0 ships the
# free-block algorithm + manual deadline input (no extra deps);
# v1.3.1 will add live EventKit reader behind the same feature flag.
calendar = []

[[bin]]
name = "solarfocus-desktop"
path = "src/main.rs"
