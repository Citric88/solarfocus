[package]
name = "solarfocus-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
env_logger = { workspace = true }
directories = { workspace = true }
rand = { workspace = true }
log = { workspace = true }
active-win-pos-rs = { workspace = true }
tokio = { workspace = true }
solar-focus-core = { path = "../../crates/core-domain" }
solar-focus-intelligence = { path = "../../crates/intelligence" }
thiserror = "1"

# Phase 3 — LLM tier (feature-gated)
llama-cpp-2 = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

# Phase 4 — ONNX classifier tier (feature-gated)
ort = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

[features]
default = []
# Enabling `llm` pulls in llama-cpp-2 (C++ build, ~2-3 min cold) + the
# model download stack. Without it, App falls back to MockCoach.
llm = ["dep:llama-cpp-2", "dep:reqwest", "dep:sha2", "dep:futures-util"]
gpu-metal = ["llm", "llama-cpp-2/metal"]
gpu-cuda = ["llm", "llama-cpp-2/cuda"]
# Phase 4 — DistilBERT-INT8 ONNX classifier. Falls back to RulesClassifier
# at runtime if the ONNX file is missing on disk.
classifier = ["dep:ort", "dep:ndarray", "dep:tokenizers"]

[[bin]]
name = "solarfocus-desktop"
path = "src/main.rs"
