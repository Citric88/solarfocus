[package]
name = "solarfocus-desktop"
version = "2.0.0"
edition = "2021"

[dependencies]
iced = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
env_logger = { workspace = true }
directories = { workspace = true }
rand = { workspace = true }
log = { workspace = true }
active-win-pos-rs = { workspace = true }
tokio = { workspace = true }
solar-focus-core = { path = "../../crates/core-domain" }
solar-focus-intelligence = { path = "../../crates/intelligence" }
thiserror = "1"
# v1.12.0 — TOML plugin loader. Same crate the intelligence rules
# parser uses; pulled in directly here so plugins ships in default build.
toml = { version = "0.8", default-features = false, features = ["parse"] }
# v2.0.0 — cross-platform notifications: NSUserNotification on macOS,
# Toast on Windows, libnotify on Linux. Replaces the v1.x osascript path.
notify-rust = "4"

# Phase 3 — LLM tier (feature-gated)
llama-cpp-2 = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }

# Phase 4 — ONNX classifier tier (feature-gated)
ort = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
# ENH-7 — share the download stack with the classifier feature too.

# v1.3 Wave B — webcam capture for presence detection (feature-gated).
# v2.0.0: `nokhwa` is declared in [target.cfg] sections at the bottom
# of this file so each OS pulls the right backend.
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

# v1.3 Wave C — read-only macOS calendar via EventKit (iCloud + Google
# + Exchange + Local in one unified API).
objc2 = { version = "0.5", optional = true }
objc2-foundation = { version = "0.2", optional = true, features = [
    "NSDate",
    "NSArray",
    "NSString",
    "NSPredicate",
    "NSError",
] }
objc2-event-kit = { version = "0.2", optional = true, features = [
    "EKEventStore",
    "EKEvent",
    "EKCalendar",
    "EKCalendarItem",
    "EKObject",
    "block2",
] }
block2 = { version = "0.5", optional = true }

[features]
default = []
# Enabling `llm` pulls in llama-cpp-2 (C++ build, ~2-3 min cold) + the
# model download stack. Without it, App falls back to MockCoach.
llm = ["dep:llama-cpp-2", "dep:reqwest", "dep:sha2", "dep:futures-util", "dep:fs2"]
gpu-metal = ["llm", "llama-cpp-2/metal"]
gpu-cuda = ["llm", "llama-cpp-2/cuda"]
# Phase 4 — DistilBERT-INT8 ONNX classifier. Falls back to RulesClassifier
# at runtime if the ONNX file is missing on disk.
# ENH-7 also pulls in the shared download stack so the classifier can
# fetch its own model + tokenizer files.
classifier = [
    "dep:ort",
    "dep:ndarray",
    "dep:tokenizers",
    "dep:reqwest",
    "dep:sha2",
    "dep:futures-util",
    "dep:fs2",
]

# v1.3 Wave B — camera-based presence detection. v1.3.0 shipped a
# brightness-change heuristic; v1.3.1 layers YuNet ONNX face detection
# on top — when the model file is present, PresenceProbe upgrades from
# brightness to face yes/no. Still uses nokhwa for capture; reuses the
# same ort + ndarray + reqwest stack already pulled in by `classifier`.
presence = [
    "dep:nokhwa",
    "dep:image",
    "dep:ort",
    "dep:ndarray",
    "dep:reqwest",
    "dep:sha2",
    "dep:futures-util",
    "dep:fs2",
]

# v1.3 Wave C — calendar-aware focus suggestions. v1.3.0 shipped the
# free-block algorithm + manual deadline input. v1.3.1 adds the live
# EventKit reader covering iCloud / Google / Exchange / Local.
calendar = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-event-kit",
    "dep:block2",
]

[[bin]]
name = "solarfocus-desktop"
path = "src/main.rs"

# v2.0.0 — per-target nokhwa backends. Declared at the end of the file
# so they don't accidentally pull subsequent [dependencies] entries
# into a target-specific section (TOML is positional).
[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10", optional = true, default-features = false, features = ["input-avfoundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "0.10", optional = true, default-features = false, features = ["input-msmf"] }

[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10", optional = true, default-features = false, features = ["input-v4l"] }
